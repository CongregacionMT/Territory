<div
  class="modal fade"
  id="modalID"
  tabindex="-1"
  aria-labelledby="modalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-gray-900" style="--bs-bg-opacity: .5;">
      <div class="modal-header bg-green-600 border border-green-600">
        <img src="../../../../assets/img/tildeVerde.png" style="width: 30px;">
        <h1 class="modal-title text-white text-lg text-center mx-4" id="modalLabel">Enviado al siervo de territorios</h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body bg-green-600 border border-green-600">
        <p class="text-xl text-white text-center">✨ ¡Muchas gracias por tu trabajo! 😄</p>
      </div>
      <div class="modal-footer bg-green-600 border border-green-600">
        <button type="button" class="bg-gray-900 text-white border border-gray-900 hover:bg-gray-800 inline-block px-4 py-2 text-center rounded transition cursor-pointer" routerLink="../../" (click)="hideModal()">Finalizar</button>
      </div>
    </div>
  </div>
</div>
