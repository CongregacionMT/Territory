@if (isOpen()) {
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[1050] transition-opacity duration-300" (click)="hideModal()"></div>
  
  <!-- Modal Dialog -->
  <div class="fixed inset-0 z-[1055] overflow-y-auto outline-none flex items-center justify-center p-4 pointer-events-none">
    <div class="relative w-full max-w-md pointer-events-auto transform transition-all duration-300 scale-100 opacity-100">
      <div class="relative bg-slate-900 border border-emerald-500/30 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
        
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 bg-emerald-600 border-b border-emerald-500">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            </div>
            <h3 class="text-xl font-bold text-white m-0">Enviado con éxito</h3>
          </div>
          <button type="button" class="text-emerald-100 hover:text-white transition-colors" (click)="hideModal()">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        
        <!-- Body -->
        <div class="p-6 bg-emerald-950/20 text-center">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-500/10 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
          </div>
          <p class="text-lg text-emerald-400 font-medium mb-0">¡Muchas gracias por tu trabajo!</p>
          <p class="text-slate-400 text-sm mt-2">La tarjeta fue enviada al siervo de territorios correctamente.</p>
        </div>
        
        <!-- Footer -->
        <div class="px-6 py-4 bg-slate-900 border-t border-slate-800 flex justify-end">
          <button 
            type="button" 
            class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold py-2.5 px-6 rounded-xl transition-all active:scale-95" 
            (click)="hideModal()"
          >
            Finalizar
          </button>
        </div>
      </div>
    </div>
  </div>
}
