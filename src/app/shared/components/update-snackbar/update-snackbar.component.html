<div class="update-snackbar relative border shadow-md rounded-md px-6 py-4">
  <!-- Botón de cerrar -->
  <button
    type="button"
    class="btn-close btn-close-white absolute top-0 end-0 m-2 close-button"
    aria-label="Cerrar"
    (click)="cerrar()"
  ></button>

  <div class="flex flex-col flex-md-row items-start align-items-md-center justify-between gap-3">
    <!-- Mensaje -->
    <div class="flex items-center gap-3">
      <span class="text-2xl">🚀</span>
      <div>
        <p class="mb-1 font-bold text-white text-base">
          ¡Hay una nueva versión de <span class="highlight-version">Territorios {{ congregationName }}</span> disponible!
        </p>
        <p class="mb-0 text-white-50 small">Actualizá para obtener las últimas mejoras.</p>
      </div>
    </div>

    <!-- Botón actualizar centrado en móvil -->
    <div class="flex justify-center justify-content-md-end w-full">
      <button
        type="button"
        class="bg-green-600 text-white border border-green-600 hover:bg-green-700 btn-sm px-4 fw-semibold update-button inline-block px-4 py-2 text-center rounded transition cursor-pointer"
        (click)="actualizarAhora()"
      >
        Actualizar ahora
      </button>
    </div>
  </div>
</div>
