<div class="grid grid-cols-1 sm:grid-cols-[repeat(auto-fill,minmax(290px,1fr))] gap-6">
  @for (cart of cartData(); track cart) {
    <div class="bg-slate-900 rounded-2xl border border-slate-700 shadow-sm flex flex-col relative transition-all duration-300 animate-[fadeInUp_0.5s_ease_backwards] hover:-translate-y-1 hover:shadow-xl"
         [class.border-sky-500]="isToday(cart.date)"
         [class.shadow-sky-500/20]="isToday(cart.date)"
         [class.shadow-lg]="isToday(cart.date)">
      
      @if (isToday(cart.date)) {
        <div class="absolute -top-3 left-3 bg-sky-600 text-white px-3 py-1 rounded-md text-sm font-extrabold z-10 flex items-center gap-1.5 shadow-md">
          <img src="https://api.iconify.design/mdi:star-circle.svg?color=white" width="16" height="16" alt="Star" />
          <span>HOY</span>
        </div>
      }

      <!-- Header -->
      <div
        class="p-4 md:p-5 flex justify-between items-center border-b border-slate-700 rounded-t-2xl transition-colors duration-300"
        [ngClass]="isToday(cart.date) ? 'bg-sky-900/30' : getTailwindColor(cart.color).bg"
      >
        <div class="flex items-center gap-3">
          <span class="text-lg md:text-xl font-extrabold capitalize transition-colors duration-300">
            {{ cart.date }}
          </span>
          <span class="text-white px-3 py-1 rounded-lg text-sm md:text-base font-bold transition-colors duration-300"
                [ngClass]="isToday(cart.date) ? 'bg-sky-600' : 'bg-slate-700'">
            {{ cart.schedule }}hs
          </span>
        </div>
      </div>

      <!-- Body -->
      <div class="p-4 md:p-5 flex flex-col gap-5">
        
        <!-- Publisher -->
        <div class="flex gap-4">
          <div class="w-11 h-11 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center shrink-0">
            <img
              src="https://api.iconify.design/mdi:account-tie.svg?color=%2394a3b8"
              width="22"
              height="22"
              alt="Publisher"
            />
          </div>
          <div class="flex flex-col justify-center">
            <label class="text-xs md:text-sm font-bold text-slate-500 uppercase mb-0.5">Publicador</label>
            <strong class="text-base md:text-lg font-semibold text-slate-200">{{ cart.assignment }}</strong>
          </div>
        </div>

        <!-- Location -->
        <div class="flex gap-4">
          <div class="w-11 h-11 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center shrink-0">
            <img
              src="https://api.iconify.design/mdi:map-marker.svg?color=%2394a3b8"
              width="22"
              height="22"
              alt="Location"
            />
          </div>
          <div class="flex flex-col justify-center w-full">
            <label class="text-xs md:text-sm font-bold text-slate-500 uppercase mb-0.5">Ubicación</label>
            <strong class="text-base md:text-lg font-semibold text-slate-200 break-words">{{ cart.location.name }}</strong>

            
          </div>
        </div>
        <div>
          @if (cart.location.linkMap) {
              <a [href]="cart.location.linkMap" target="_blank" class="mt-2.5 inline-flex items-center gap-2 bg-slate-800 text-sky-400 px-3.5 py-1.5 rounded-xl text-sm md:text-base font-semibold no-underline border border-slate-700 w-fit hover:bg-slate-700 transition-colors cursor-pointer">
                <img
                  src="https://api.iconify.design/logos:google-maps.svg"
                  width="18"
                  height="18"
                  alt="Maps"
                />
                Ver en Mapa
              </a>
            }
        </div>
      </div>
    </div>
  }
</div>
