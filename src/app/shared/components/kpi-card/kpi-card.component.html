<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col items-center text-center transition-transform hover:-translate-y-1 hover:shadow-xl print:border-gray-300 print:bg-transparent print:p-2">
  <div class="w-14 h-14 rounded-full flex items-center justify-center mb-4 print:hidden" [class]="bgClass() + ' ' + colorClass()">
    @if (icon()) {
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [innerHTML]="icon()"></svg>
    } @else {
      <ng-content select="[icon]"></ng-content>
    }
  </div>
  <div class="hidden print:block mb-2" [class]="colorClass()">
    @if (icon()) {
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [innerHTML]="icon()"></svg>
    } @else {
      <ng-content select="[icon]"></ng-content>
    }
  </div>
  <div class="flex flex-col justify-center flex-grow">
    <h3 class="text-3xl font-black text-white mb-2 print:text-black">
      {{ value() }}
      @if (total() !== undefined && total() !== null) {
        <span class="text-lg text-slate-500 font-medium ml-1">/{{ total() }}</span>
      }
    </h3>
    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-0 mt-auto print:text-gray-600">{{ title() }}</p>
  </div>
</div>
