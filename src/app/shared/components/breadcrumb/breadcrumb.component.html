<nav aria-label="breadcrumb" class="mt-6 mb-4">
  <ol class="flex items-center gap-1 bg-gray-800/80 rounded-xl px-5 py-3 text-sm list-none m-0">
    @for (item of breadcrumbItems(); track item.route; let isLast = $last) {
      @if (!isLast) {
        <li class="flex items-center">
          <a
            [routerLink]="item.route"
            class="text-green-400 hover:text-blue-400 hover:underline no-underline transition-colors"
          >{{ item.name }}</a>
          <span class="text-gray-600 mx-2 select-none">/</span>
        </li>
      } @else {
        <li class="text-gray-300 font-medium" aria-current="page">
          {{ item.name }}
        </li>
      }
    }
  </ol>
</nav>
