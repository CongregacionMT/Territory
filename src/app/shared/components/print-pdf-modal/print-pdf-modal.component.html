<!-- Backdrop -->
<div 
  class="fixed top-0 left-0 w-full h-full bg-gray-900 animate__animated animate__fadeIn"
  style="opacity: 0.7; z-index: 1040;"
  (click)="closeModal()"
></div>

<!-- Modal Content -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 animate__animated animate__zoomIn" style="width: 90%; max-width: 400px; z-index: 1050;">
  <div class="bg-white shadow-lg rounded-lg border-0 print-modal overflow-hidden">
    
    <!-- Modal Header -->
    <div class="bg-white border-b flex justify-between items-center p-4 rounded-t-lg">
      <h5 class="mb-0 font-bold text-gray-900 flex items-center text-lg">
        <img src="https://api.iconify.design/mdi:printer.svg?color=%230277bd" width="24" height="24" class="mr-2" alt="Print" />
        Imprimir salidas
      </h5>
      <button type="button" class="text-gray-400 hover:text-gray-900 text-2xl font-bold leading-none cursor-pointer" (click)="closeModal()" aria-label="Close">&times;</button>
    </div>

    <!-- Modal Body -->
    <div class="p-6">
      <p class="text-gray-500 mb-2 text-sm">
        Se generará un PDF con las salidas de <strong>todos los grupos</strong> en una misma hoja, optimizado para imprimir.
      </p>
      <p class="text-gray-500 mb-6 text-sm flex items-start">
        <img src="https://api.iconify.design/mdi:information-outline.svg?color=%236c757d" width="16" height="16" class="mr-1 mt-0.5" alt="Info" />
        <span>El rango de impresión es de <strong>viernes a jueves</strong> para colocar en el tablero.</span>
      </p>

      <div class="flex flex-col gap-4">
        <!-- B&W Button -->
        <button 
          class="w-full bg-gray-100 hover:bg-gray-200 border border-gray-300 py-4 px-4 rounded-md flex items-center justify-center gap-3 transition cursor-pointer disabled:opacity-50"
          (click)="printPdf('bw')"
          [disabled]="isPrintingPdf()"
          id="btn-print-all-bw"
        >
          <img src="https://api.iconify.design/mdi:printer-outline.svg?color=%23333333" width="24" height="24" alt="B&W" />
          <div class="text-left">
            <div class="font-bold text-gray-800 leading-tight">Blanco y negro</div>
            <div class="text-xs text-gray-500">Ahorra tinta</div>
          </div>
        </button>

        <!-- Color Button -->
        <button 
          class="w-full bg-blue-600 hover:bg-blue-700 text-white border border-blue-600 py-4 px-4 rounded-md flex items-center justify-center gap-3 transition cursor-pointer disabled:opacity-50"
          (click)="printPdf('color')"
          [disabled]="isPrintingPdf()"
          id="btn-print-all-color"
        >
          <img src="https://api.iconify.design/mdi:palette.svg?color=%23ffffff" width="24" height="24" alt="Color" />
          <div class="text-left">
            <div class="font-bold leading-tight text-white">Imprimir en color</div>
            <div class="text-xs text-blue-200">Diseño completo</div>
          </div>
        </button>
      </div>

      @if (isPrintingPdf()) {
        <div class="text-center mt-6 flex justify-center items-center">
          <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-600"></div>
          <span class="text-gray-500 ml-3 text-sm">Generando PDF...</span>
        </div>
      }
      @if (pdfGenerated()) {
        <div class="text-center mt-6 text-green-600 flex justify-center items-center animate__animated animate__fadeIn">
          <img src="https://api.iconify.design/mdi:check-circle.svg?color=%23198754" width="20" height="20" class="mr-2" alt="Success" />
          <span class="font-bold text-sm">¡PDF generado con éxito!</span>
        </div>
      }
    </div>
  </div>
</div>
