<div class="container mx-auto px-4 py-8 max-w-6xl text-slate-200">
  <div class="max-w-4xl mx-auto">

    <h1 class="text-2xl font-extrabold text-white text-center mb-4">Seleccioná una localidad</h1>

    <!-- Botones de localidades -->
    <div class="flex flex-wrap justify-center gap-4 mb-6">
      @for (terr of territorioMaps; track terr) {
        <app-card-xl
          mapSRC="{{ terr.src }}"
          mapName="{{ terr.name }}"
          [routerLink]="terr.link"
        ></app-card-xl>
      }
    </div>

    <hr />

    <!-- Territorios agrupados por localidad -->
    @if (isAdmin() || isDriver()) {
      @for (locality of localitiesWithTerritories; track locality.key) {
        <div class="mb-6">
          <h2 class="text-lg font-bold text-white text-center mb-3">
            Territorios de {{ locality.name }} por Número
          </h2>

          <div class="flex flex-wrap justify-center gap-3">
            @for (item of locality.territories; track item) {
              <app-card-s
                [terrNumber]="item"
                [routerLink]="item.collection"
                (click)="this.cardService.rollbackCard()"
              >
              </app-card-s>
            }
          </div>
        </div>
      }
    }

  </div>
</div>
