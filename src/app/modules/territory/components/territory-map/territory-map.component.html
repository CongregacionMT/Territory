<div #mapContainer class="map-container"
     [class.loaded]="mapLoaded()"
     [class.fallback]="useFallback()"
     [class.has-error]="error() !== null">
  @if (error() && !useFallback() && !useOfflineViewer()) {
    <div class="map-error-overlay">
      <p>{{ error() }}</p>
      <div class="flex flex-col gap-2">
        <button class="bg-blue-600 text-white border border-blue-600 hover:bg-blue-700 inline-block px-4 py-2 text-center rounded transition cursor-pointer" (click)="retry()">Reintentar</button>
        <button class="bg-slate-600 text-white border border-slate-600 hover:bg-slate-700 inline-block px-4 py-2 text-center rounded transition cursor-pointer" (click)="switchToFallback()">Cargar mapa antiguo</button>
      </div>
    </div>
  }
  @if (useOfflineViewer()) {
    <app-offline-map-viewer [kmlUrl]="currentMapConfig().kmlUrl || ''"></app-offline-map-viewer>
  }
</div>

@if (mapLoaded() && !useFallback() && !useOfflineViewer()) {
  <div class="map-controls">
    <button class="compass-btn"
            (click)="toggleCompass()"
            [class.active]="compassMode()"
            title="Modo brújula">
      🧭
    </button>

    <button class="compass-btn"
            (click)="centerOnMe()"
            title="Centrar en mi ubicación">
      📍
    </button>

    <button class="compass-btn"
            (click)="toggleFullscreen()"
            [title]="isFullscreen() ? 'Salir de pantalla completa' : 'Pantalla completa'">
      @if (isFullscreen()) {
        <i class="fas fa-compress"></i>
      } @else {
        <i class="fas fa-expand"></i>
      }
    </button>

  </div>

  <div class="mt-2 text-center">
    <button type="button" class="btn-sm btn-outline-secondary inline-block px-4 py-2 text-center rounded transition cursor-pointer" (click)="switchToFallback()">
      <i class="fas fa-map-marked-alt mr-1"></i> Cargar mapa antiguo
    </button>
  </div>
}
