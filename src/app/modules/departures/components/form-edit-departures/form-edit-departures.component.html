
@for (group of groupKeys.sort(); track group) {
  <div class="p-4 sm:p-6 rounded-3xl mb-6 border" [ngClass]="group > 0 ? 'bg-slate-900/65 border-l-4 border-l-sky-400/90 border-slate-600/30' : 'bg-slate-800/45 border-slate-600/30'">
    <h3 class="text-2xl font-extrabold text-slate-50 text-center mb-4">{{ getGroupTitle(group) }}</h3>
    <form [formGroup]="formDeparture" class="flex flex-col justify-center">
      <div class="flex flex-wrap -mx-4 gap-y-3">
        @for (
          days of filterControlsByGroup(group);
          track days;
          let i = $index
        ) {
          <div class="w-full px-4">
            <app-departure-day-card
              [dayFormGroup]="getFormGroup(days)"
              [index]="i"
              [groupIndex]="group"
              [isAdmin]="isAdmin"
              [drivers]="drivers()"
              [localities]="localities"
              [suggestedTerritories]="getSuggestedTerritories(i, group)"
              [quickSuggestionText]="getQuickSuggestionText(i, group)"
              (delete)="deleteInputForm(i, group)"
              (copy)="copyDay(i, group)"
              (openModal)="openModal(i, group)"
              (applySuggested)="applySuggestedTerritory(i, group, $event)"
            ></app-departure-day-card>
          </div>
        }
      </div>

      <div class="w-full flex justify-center mt-6">
        <button
          type="button"
          class="group relative inline-flex items-center justify-center px-6 py-2.5 text-sm font-bold text-slate-300 bg-slate-800/50 border border-slate-700/50 rounded-2xl hover:bg-slate-700 hover:text-white hover:border-blue-500/50 transition-all duration-300 overflow-hidden cursor-pointer w-full max-w-sm"
          (click)="addInputForm(group)"
        >
          <div class="absolute inset-0 w-0 bg-blue-600/20 transition-all duration-300 ease-out group-hover:w-full"></div>
          <i class="fas fa-plus mr-2 text-blue-400 group-hover:text-blue-300 transition-colors"></i>
          <span class="relative z-10">Agregar salida al grupo</span>
        </button>
      </div>
    </form>
  </div>
}

<div class="flex flex-col md:flex-row justify-between items-center bg-slate-800/50 p-4 sm:p-6 rounded-3xl border border-slate-700/50 gap-4 mt-8">
  <div class="flex flex-col">
    <span class="text-slate-400 text-sm font-medium">Estado del formulario</span>
    <span class="text-slate-200 font-bold flex items-center gap-2">
      @if (formDeparture.valid) {
        <i class="fas fa-check-circle text-green-500"></i> Listo para guardar
      } @else {
        <i class="fas fa-exclamation-circle text-amber-500"></i> Faltan campos requeridos
      }
    </span>
  </div>
  <button
    (click)="submitForm()"
    [disabled]="!formDeparture.valid || formDeparture.pristine"
    class="relative inline-flex items-center justify-center px-8 py-3 text-sm font-bold text-white transition-all duration-300 rounded-2xl overflow-hidden group w-full md:w-auto"
    [ngClass]="formDeparture.valid && !formDeparture.pristine ? 'bg-blue-600 hover:bg-blue-700 cursor-pointer shadow-[0_0_20px_rgba(37,99,235,0.3)] hover:shadow-[0_0_30px_rgba(37,99,235,0.5)]' : 'bg-slate-700 text-slate-400 cursor-not-allowed border border-slate-600'"
  >
    @if (formDeparture.valid && !formDeparture.pristine) {
      <div class="absolute inset-0 w-0 bg-white/20 transition-all duration-300 ease-out group-hover:w-full"></div>
    }
    <i class="fas fa-save mr-2"></i>
    <span class="relative z-10">{{ formDepartureDataInput().length > 0 ? 'Actualizar semana' : 'Guardar semana' }}</span>
  </button>
</div>

@if (activeModal()) {
  <app-territory-selection-modal
    [activeModalDays]="getFormGroup(activeModalDays!)"
    [dayIndex]="activeModal()!.dayIndex"
    [groupKey]="activeModal()!.groupKey"
    [formDeparture]="formDeparture"
    [territoryLastCompletedDays]="territoryLastCompletedDays()"
    [territoryGroupsMap]="territoryGroupsMap()"
    [territoryNumbersCache]="territoryOptionsMap()"
    [personalAssignments]="personalAssignments()"
    [localities]="localities"
    (modalClose)="closeModal()"
  ></app-territory-selection-modal>
}
