<div class="bg-slate-900 border border-slate-800 shadow-2xl rounded-2xl overflow-hidden transition-all duration-300 hover:shadow-sky-900/10 mt-10">
  <div class="bg-gradient-to-r from-slate-800 to-slate-900 border-b border-slate-700 p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-emerald-500/20 p-2.5 rounded-lg border border-emerald-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-400"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      </div>
      <div>
        <h2 class="text-xl font-bold text-white m-0">Ubicaciones</h2>
        <p class="text-sm text-slate-400 m-0">Administra los puntos geográficos</p>
      </div>
    </div>
    
    <button
      type="button"
      class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 px-5 rounded-lg transition-colors flex items-center gap-2 text-sm shadow-lg shadow-emerald-600/20 w-full sm:w-auto justify-center"
      (click)="addLocationForm()"
      title="Nueva ubicación"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Nueva Ubicación
    </button>
  </div>

  <form [formGroup]="formLocations" (ngSubmit)="submitLocationsForm()" class="p-6">
    <div formArrayName="locations" class="space-y-6">
      
      <!-- Table Headers -->
      <div class="hidden xl:grid grid-cols-[1.5fr_2fr_auto] gap-4 mb-2 px-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">
        <div>Nombre</div>
        <div>Link de Maps</div>
        <div class="text-center w-12">Acción</div>
      </div>

      @for (location of locationsFormArray.controls; track $index; let i = $index) {
        <div [formGroupName]="i" class="group relative bg-slate-800/50 xl:bg-transparent rounded-xl xl:rounded-none p-4 xl:p-2 border border-slate-700/50 xl:border-transparent xl:border-b xl:border-slate-800 grid grid-cols-1 xl:grid-cols-[1.5fr_2fr_auto] gap-4 xl:gap-4 items-end xl:items-center hover:bg-slate-800 transition-colors">
          
          <!-- Nombre -->
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-slate-300 xl:hidden">Nombre</label>
            <input
              type="text"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-slate-500 focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all outline-none"
              placeholder="Ej: Plaza Central"
              formControlName="name"
              aria-label="Nombre de ubicación"
            />
          </div>

          <!-- Link -->
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-slate-300 xl:hidden">Enlace (Maps)</label>
            <input
              type="text"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-slate-500 focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all outline-none"
              placeholder="https://maps.google.com/..."
              formControlName="linkMap"
              aria-label="Link de Maps"
            />
          </div>

          <!-- Borrar -->
          <div class="flex xl:justify-center mt-2 xl:mt-0">
            <button
              type="button"
              class="w-full xl:w-10 h-10 flex items-center justify-center rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white border border-red-500/20 hover:border-red-500 transition-all"
              (click)="deleteLocationForm(i)"
              title="Eliminar ubicación"
              aria-label="Eliminar ubicación"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              <span class="xl:hidden ml-2 font-medium">Eliminar</span>
            </button>
          </div>
        </div>
      }

      @if (locationsFormArray.controls.length === 0) {
        <div class="text-center py-8 bg-slate-800/30 rounded-xl border border-slate-700 border-dashed">
          <p class="text-slate-400">No hay ubicaciones configuradas. Agrega una nueva.</p>
        </div>
      }
    </div>

    <!-- Acciones -->
    <div class="mt-8 pt-6 border-t border-slate-800 flex justify-end">
      <button
        type="submit"
        class="bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-emerald-600/20 hover:shadow-xl hover:-translate-y-0.5 transition-all flex items-center gap-2"
        [disabled]="formLocations.invalid"
        [class.opacity-50]="formLocations.invalid"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        Guardar Ubicaciones
      </button>
    </div>
  </form>
</div>
