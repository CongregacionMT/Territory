<div class="container mx-auto px-4 py-8 max-w-7xl">
  
  <!-- Header -->
  <div class="flex flex-col items-center mb-10 mt-2 text-center">
    <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight m-0 leading-tight">Programa del carrito</h1>
    <p class="text-cyan-100 mt-3 text-base md:text-lg max-w-2xl font-medium">
      Recordá siempre repasar las Pautas para la predicación pública 📋✨
    </p>
  </div>

  <!-- Cart Data or Empty State -->
  @if (cartData().length > 0) {
    <div class="w-full">
      <app-cart-assignment-cards
        [cartData]="cartData()"
      ></app-cart-assignment-cards>
    </div>
  } @else {
    <div class="flex flex-col items-center justify-center py-16 px-4 bg-white/10 backdrop-blur-md rounded-3xl border border-white/20 mt-8 shadow-xl max-w-3xl mx-auto text-center">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-white/80 mb-6"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
      <h3 class="text-2xl font-bold text-white mb-3 m-0">Sin arreglos de carrito</h3>
      <p class="text-sky-100 text-lg mb-8 max-w-md mx-auto">No hay arreglos del carrito programados en este momento.</p>
      
      <a
        class="bg-gradient-to-r from-sky-500 to-blue-600 text-white hover:from-sky-400 hover:to-blue-500 border border-blue-400 hover:border-blue-300 px-8 py-3.5 text-lg font-bold rounded-xl transition-all duration-300 shadow-lg hover:shadow-xl hover:-translate-y-1 cursor-pointer flex items-center justify-center gap-2"
        routerLink="editar"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Crear arreglos
      </a>
    </div>
  }

  <!-- Admin Controls -->
  @if (isAdmin()) {
    <div class="flex justify-center my-10">
      <a
        class="bg-white/10 hover:bg-white/20 backdrop-blur-sm text-white border border-white/30 px-6 py-3 text-base font-semibold rounded-xl transition-all duration-300 shadow-sm hover:shadow-md cursor-pointer flex items-center justify-center gap-2"
        routerLink="editar"
        >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        Editar asignaciones
      </a>
    </div>
  }

  <!-- Maps Section (Commented Out but Styled) -->

  <div class="mt-12 mb-8">
    <h2 class="text-3xl font-extrabold text-white tracking-tight text-center mb-8">Ubicaciones aprobadas</h2>
    <div class="flex flex-col md:flex-row justify-center items-center gap-8 overflow-hidden rounded-3xl bg-white/5 p-4 md:p-8 border border-white/10 backdrop-blur-sm">
      <iframe src="https://www.google.com/maps/d/embed?mid=18bUhpoL7BvyObAYi3AhADHFQ6AONHMs&ehbc=2E312F&noprof=1" class="w-full md:w-1/2 h-[60vh] min-h-[400px] rounded-2xl border border-white/20 shadow-xl" loading="lazy" allowfullscreen></iframe>
      <iframe src="https://www.google.com/maps/d/embed?mid=1HGl4WD5Is6ntObB3G-o1GPBE6Il9-Xw&ehbc=2E312F" class="w-full md:w-1/2 h-[60vh] min-h-[400px] rounded-2xl border border-white/20 shadow-xl" loading="lazy" allowfullscreen></iframe>
    </div>
  </div> 
  -->
</div>
