<div class="min-h-screen py-6 px-3 sm:px-6">
  <div class="max-w-7xl mx-auto">
    
    <!-- Header y Filtros -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 w-full">
      <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-0 tracking-tight break-words">
        Estadísticas de {{ nameTitleTerritory() }}
      </h1>

      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
        <button
          type="button"
          class="bg-slate-900 border border-slate-700 hover:bg-slate-800 text-slate-300 shadow-sm flex-shrink-0 inline-flex items-center justify-center w-10 h-10 rounded-lg transition-colors cursor-pointer"
          (click)="refreshData()"
          title="Refrescar datos"
          aria-label="Refrescar datos"
        >
          <i class="fas fa-sync-alt" [class.fa-spin]="!loadingData()"></i>
        </button>

        <div class="flex rounded-lg shadow-sm overflow-x-auto border border-slate-700 bg-slate-900" role="group" aria-label="Filtro de tiempo">
          <button
            type="button"
            class="px-4 py-2 text-sm font-medium transition-colors border-r border-slate-700 last:border-r-0 whitespace-nowrap"
            [class.bg-sky-600]="timeRange() === 1"
            [class.text-white]="timeRange() === 1"
            [class.text-slate-400]="timeRange() !== 1"
            [class.hover:bg-slate-800]="timeRange() !== 1"
            [class.hover:text-slate-300]="timeRange() !== 1"
            (click)="setTimeRange(1)"
          >
            1 Mes
          </button>
          <button
            type="button"
            class="px-4 py-2 text-sm font-medium transition-colors border-r border-slate-700 last:border-r-0 whitespace-nowrap"
            [class.bg-sky-600]="timeRange() === 3"
            [class.text-white]="timeRange() === 3"
            [class.text-slate-400]="timeRange() !== 3"
            [class.hover:bg-slate-800]="timeRange() !== 3"
            [class.hover:text-slate-300]="timeRange() !== 3"
            (click)="setTimeRange(3)"
          >
            3 Meses
          </button>
          <button
            type="button"
            class="px-4 py-2 text-sm font-medium transition-colors border-r border-slate-700 last:border-r-0 whitespace-nowrap"
            [class.bg-sky-600]="timeRange() === 6"
            [class.text-white]="timeRange() === 6"
            [class.text-slate-400]="timeRange() !== 6"
            [class.hover:bg-slate-800]="timeRange() !== 6"
            [class.hover:text-slate-300]="timeRange() !== 6"
            (click)="setTimeRange(6)"
          >
            6 Meses
          </button>
          <button
            type="button"
            class="px-4 py-2 text-sm font-medium transition-colors border-r border-slate-700 last:border-r-0 whitespace-nowrap"
            [class.bg-sky-600]="timeRange() === 12"
            [class.text-white]="timeRange() === 12"
            [class.text-slate-400]="timeRange() !== 12"
            [class.hover:bg-slate-800]="timeRange() !== 12"
            [class.hover:text-slate-300]="timeRange() !== 12"
            (click)="setTimeRange(12)"
          >
            1 Año
          </button>
          <button
            type="button"
            class="px-4 py-2 text-sm font-medium transition-colors whitespace-nowrap"
            [class.bg-sky-600]="timeRange() === 120"
            [class.text-white]="timeRange() === 120"
            [class.text-slate-400]="timeRange() !== 120"
            [class.hover:bg-slate-800]="timeRange() !== 120"
            [class.hover:text-slate-300]="timeRange() !== 120"
            (click)="setTimeRange(120)"
          >
            Histórico
          </button>
        </div>
      </div>
    </div>

    <!-- Summary Cards Section -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <app-stat-card
        title="Territorios"
        [value]="summaryStats().totalTerritories"
        subtitle="Total en localidad"
        icon="fa-map-marked-alt"
        iconBgColorClass="bg-sky-500/10"
        iconColorClass="text-sky-500"
      ></app-stat-card>

      <app-stat-card
        title="Completados"
        [value]="summaryStats().completedInPeriod"
        subtitle="Territorios finalizados"
        icon="fa-flag-checkered"
        iconBgColorClass="bg-emerald-500/10"
        iconColorClass="text-emerald-500"
      ></app-stat-card>

      <app-stat-card
        title="Cobertura"
        [value]="(summaryStats().percentCompleted | number: '1.0-1') || '0'"
        subtitle="Manzanas recorridas"
        icon="fa-th"
        iconBgColorClass="bg-amber-500/10"
        iconColorClass="text-amber-500"
        [isPercentage]="true"
      ></app-stat-card>

      <app-stat-card
        title="Manzanas"
        [value]="summaryStats().totalApples"
        subtitle="Total recorridos en periodo"
        icon="fa-history"
        iconBgColorClass="bg-indigo-500/10"
        iconColorClass="text-indigo-500"
      ></app-stat-card>
    </div>

    <!-- Data Table -->
    @if (loadingData()) {
      <app-statistics-table
        [data]="dataListFull()"
        [path]="currentSortPath"
        [order]="order"
        [personalTerritories]="personalTerritories()"
        [greenThreshold]="green.value"
        [blueThreshold]="blue.value"
        [yellowThreshold]="yellow.value"
        (sortChanged)="onSortChanged($event)"
      ></app-statistics-table>
    }

    <!-- Leyenda -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-sm mb-8">
      <h5 class="mb-6 flex items-center text-lg font-bold text-white">
        <i class="fas fa-info-circle mr-3 text-sky-500"></i>
        Leyenda de Actividad (Días desde completado)
      </h5>
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
        
        <app-legend-item
          title="Reciente"
          description="Aún se considera vigente"
          [control]="green"
          ariaLabel="Días para considerar el territorio en estado Reciente (verde)"
          bgClass="bg-emerald-900/10"
          borderClass="border-emerald-500/20 border-l-emerald-500"
          textClass="text-emerald-400"
        ></app-legend-item>

        <app-legend-item
          title="Pendiente"
          description="Vencimiento próximo"
          [control]="blue"
          ariaLabel="Días para considerar el territorio en estado Pendiente (azul)"
          bgClass="bg-sky-900/10"
          borderClass="border-sky-500/20 border-l-sky-500"
          textClass="text-sky-400"
        ></app-legend-item>

        <app-legend-item
          title="Necesario"
          description="Prioridad media"
          [control]="yellow"
          ariaLabel="Días para considerar el territorio en estado Necesario (amarillo)"
          bgClass="bg-amber-900/10"
          borderClass="border-amber-500/20 border-l-amber-500"
          textClass="text-amber-400"
        ></app-legend-item>

        <app-legend-item
          title="Urgente"
          description="Hace más de este tiempo"
          [control]="red"
          ariaLabel="Días para considerar el territorio en estado Urgente (rojo)"
          bgClass="bg-rose-900/10"
          borderClass="border-rose-500/20 border-l-rose-500"
          textClass="text-rose-400"
        ></app-legend-item>

      </div>
    </div>

  </div>
</div>
