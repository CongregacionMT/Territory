<div class="container table-responsive">
  <div class="flex justify-center">
    <h1 class="mt-0 mb-4">Selecciona una localidad</h1>
  </div>
  
  <!-- Botones de localidades para estadísticas -->
  <div class="card-container flex justify-center mb-4">
    @for (group of CardButtonsStatistics(); track group) {
      <app-card-xl
        [mapName]="group.name"
        [mapSRC]="group.src"
        [routerLink]="group.link"
      ></app-card-xl>
    }
  </div>
</div>
